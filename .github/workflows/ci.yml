name: CI

on:
  push:
    branches: [main, "rc*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: checks (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      # Actions are pinned to a commit: a tag like v4 can be moved to different code. Dependabot keeps the pins current.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # the steps below run the repo's own tests: no token left in .git/config
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Vault rules
        run: python scripts/verify
      - name: Prerequisites (required checks only)
        run: python doctor.py --ci
      - name: Template tests (setup, doctor, jobs, docs)
        run: python -m unittest discover -s tests -v
      - name: Wizard with every module, then the vault rules again
        run: |
          python setup.py --answers tests/risposte-tutti.json --yes
          python scripts/verify
          python install_jobs.py --dry-run --all --os linux --out out-all
      - name: Job files can be generated for every system
        run: |
          python install_jobs.py --dry-run --os linux --out out-linux
          python install_jobs.py --dry-run --os macos --out out-macos
          python install_jobs.py --dry-run --os windows --out out-windows
      - name: Script tests
        run: python -m unittest discover -s scripts -p "test_*.py"

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
